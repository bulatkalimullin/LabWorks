events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker embedded DNS — re-resolve upstreams after container recreate
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      https;
    }

    upstream api_backend {
        zone api_backend 64k;
        least_conn;
        server api:8000 resolve;
    }
    upstream daphne_backend {
        zone daphne_backend 64k;
        server daphne:8001 resolve;
    }
    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:80 resolve;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 200M;
        client_body_timeout 600s;
        send_timeout 600s;

        location /ws/ {
            proxy_pass http://daphne_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400;
        }
        location /api/ {
            proxy_pass http://api_backend;
            proxy_redirect off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
        location ^~ /admin {
            proxy_pass http://api_backend;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
        location ^~ /media/course_images/ {
            alias /var/www/media/course_images/;
        }
        location /media/ {
            return 403;
        }
        location /protected-media/ {
            internal;
            alias /var/www/media/;
            default_type application/octet-stream;
            # Avoid 206 partial responses breaking fetch().blob() downloads.
            max_ranges 0;
            aio off;
            sendfile on;
            send_timeout 600s;
        }
        location /static/ {
            proxy_pass http://api_backend;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
